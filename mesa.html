<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mesa • ORDEM</title>

<link rel="stylesheet" href="global.css">
<link rel="stylesheet" href="mesa.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="background">

<div class="background-overlay"></div>

<div class="particles"></div>

</div>

<div class="table-app">

<!--======================================================
                    MENU LATERAL
=======================================================-->

<aside
id="tableSidebar"
class="table-sidebar">

<div class="table-sidebar-brand">

<div class="table-sidebar-symbol">

◇

</div>

<div>

<span>

ORDEM

</span>

<strong id="sidebarRoleTitle">

MESA

</strong>

</div>

</div>

<nav
id="tableMenu"
class="table-menu">

<!-- Preenchido pelo mesa.js conforme jogador/mestre -->

</nav>

<div class="table-sidebar-footer">

<button
type="button"
id="leaveTable"
class="table-menu-button danger">

<span class="table-menu-icon">

↩

</span>

<span class="table-menu-label">

Sair

</span>

</button>


</div>

</aside>

<!--======================================================
                    CONTEÚDO PRINCIPAL
=======================================================-->

<main class="table-main">

<!--======================================================
                    CABEÇALHO
=======================================================-->

<header class="table-header">

<div class="table-header-info">

<span
id="tableCampaignLabel"
class="table-header-label">

CAMPANHA

</span>

<h1 id="tableCampaignName">

Carregando...

</h1>

</div>

<div class="table-header-actions">

<div class="table-role-badge">

<span id="tableRoleIcon">

◇

</span>

<strong id="tableRoleName">

Jogador

</strong>

</div>

<button
type="button"
id="toggleChat"
class="table-header-button">

💬

</button>

</div>

</header>

<!--======================================================
                    CENÁRIO
=======================================================-->

<section class="scene-shell">

<div class="table-play-area">

    <!-- MAPA -->

    <div class="table-map-column">

        <div
            id="sceneBackground"
            class="scene-background">
            
            <!--
                As posições dos jogadores,
                ameaças e NPCs continuam aqui.
            -->

        </div>

    </div>


<section
    id="tableChat"
    class="table-chat table-chat-side">

    <div class="table-chat-header">

        <div>

            <span class="table-chat-label">
                COMUNICAÇÃO
            </span>

            <h2>
                Chat
            </h2>

        </div>


        <button
            type="button"
            id="collapseChat"
            class="chat-collapse-button">

            ›

        </button>

    </div>


    <div
        id="chatMessages"
        class="table-chat-messages">

        <div class="chat-system-message">

            <span class="chat-system-icon">
                ◇
            </span>

            <div>

                <strong>
                    Sistema
                </strong>

                <p>
                    Bem-vindo à mesa.
                </p>

            </div>

        </div>

    </div>


    <div class="table-chat-input">

        <input
            type="text"
            id="chatInput"
            placeholder="Digite uma mensagem...">


        <button
            type="button"
            id="sendChatMessage"
            class="chat-send-button">

            Enviar

        </button>

    </div>

</section>


</main>


<div
id="tablePanelOverlay"
class="table-panel-overlay hidden">

<div
id="tableSidePanel"
class="table-side-panel">

<div class="table-side-panel-header">

<div>

<span
id="tablePanelLabel"
class="table-panel-label">

PAINEL

</span>

<h2 id="tablePanelTitle">

Painel

</h2>

</div>

<button
type="button"
id="closeTablePanel"
class="table-panel-close">

✕

</button>

</div>

<div
id="tablePanelContent"
class="table-panel-content">

<!-- Conteúdo inserido pelo mesa.js -->

</div>

</div>

</div>

<!--======================================================
=              PAINEL DE TOKEN / POSIÇÃO
==========================================================-->

<div
id="positionModal"
class="table-modal hidden">

<div class="table-modal-content">

<div class="table-modal-header">

<div>

<span class="table-panel-label">

POSIÇÃO

</span>

<h2 id="positionModalTitle">

Posição

</h2>

</div>

<button
type="button"
id="closePositionModal"
class="table-panel-close">

✕

</button>

</div>

<div
id="positionModalBody"
class="table-modal-body">

<!-- Conteúdo via JavaScript -->

</div>

</div>

</div>

<!--======================================================
=              PAINEL DE DADOS
==========================================================-->

<div
id="diceModal"
class="table-modal hidden">

<div class="table-modal-content dice-modal-content">

<div class="table-modal-header">

<div>

<span class="table-panel-label">

ROLAGEM

</span>

<h2>

Dados

</h2>

</div>

<button
type="button"
id="closeDiceModal"
class="table-panel-close">

✕

</button>

</div>

<div class="dice-quick-grid">

<button
type="button"
class="dice-quick-button"
data-die="20">

d20

</button>

<button
type="button"
class="dice-quick-button"
data-die="12">

d12

</button>

<button
type="button"
class="dice-quick-button"
data-die="10">

d10

</button>

<button
type="button"
class="dice-quick-button"
data-die="8">

d8

</button>

<button
type="button"
class="dice-quick-button"
data-die="6">

d6

</button>

<button
type="button"
class="dice-quick-button"
data-die="4">

d4

</button>

</div>

<div class="custom-roll">

<div class="field">

<label for="diceAmount">

Quantidade

</label>

<input
type="number"
id="diceAmount"
min="1"
max="100"
value="1">

</div>

<div class="field">

<label for="diceSides">

Dado

</label>

<select id="diceSides">

<option value="20">d20</option>

<option value="12">d12</option>

<option value="10">d10</option>

<option value="8">d8</option>

<option value="6">d6</option>

<option value="4">d4</option>

<option value="100">d100</option>

</select>

</div>

<div class="field">

<label for="diceModifier">

Modificador

</label>

<input
type="number"
id="diceModifier"
value="0">

</div>

</div>

<button
type="button"
id="rollCustomDice"
class="primary-button full-button">

Rolar

</button>

</div>



</div>

<!--======================================================
=              PAINEL DE CONFIRMAÇÃO
==========================================================-->

<div
id="tableConfirmModal"
class="table-modal hidden">

<div class="table-modal-content compact-modal">

<div class="table-confirm-icon">

◇

</div>

<h2 id="tableConfirmTitle">

Confirmar

</h2>

<p id="tableConfirmText">

Deseja continuar?

</p>

<div class="table-confirm-actions">

<button
type="button"
id="tableConfirmCancel"
class="secondary-button">

Cancelar

</button>

<button
type="button"
id="tableConfirmAccept"
class="primary-button">

Confirmar

</button>

</div>

</div>

</div>

<!--======================================================
=              ÁUDIO DA CAMPANHA
==========================================================-->

<audio
id="campaignMusicPlayer"
loop>

</audio>

<!--======================================================
=              INPUTS OCULTOS DO MESTRE
==========================================================-->

<input
type="file"
id="sceneUploadInput"
accept="image/png,image/jpeg,image/webp"
hidden>

<input
type="file"
id="musicUploadInput"
accept="audio/*"
hidden>

<!--======================================================
=              SCRIPTS
==========================================================-->

<script src="mesa.js"></script>

</body>

</html>
