<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Ameaças • ORDEM

</title>

<link
rel="stylesheet"
href="/global.css">

<link
rel="stylesheet"
href="/ameacas.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="background">

<div class="background-overlay"></div>

<div class="particles"></div>

</div>

<main class="enemy-page">

<header class="page-header">

<a
href="index.html"
class="back-button">

← Voltar

</a>

<h1>

AMEAÇAS

</h1>

<p>

Crie criaturas, NPCs e chefes para suas campanhas.

</p>

</header>

<section class="enemy-actions">

<button
id="newEnemy"
class="primary-button">

＋ Nova Ameaça

</button>

<input

type="text"

id="searchEnemy"

placeholder="Pesquisar ameaça...">

</section>

<section
id="enemyList"
class="enemy-list">

<!--==================================
            AMEAÇA
===================================-->

<div class="enemy-card">

<div class="enemy-photo">

<img

src="assets/enemies/default.png"

alt="Ameaça">

</div>

<div class="enemy-info">

<h2>

Lobo Infectado

</h2>

<p>

Sangue

</p>

<p>

Nível 3

</p>

</div>

<div class="enemy-buttons">

<button
class="edit-button">

Editar

</button>

<button
class="campaign-button">

Campanha

</button>

</div>

</div>

<!--==================================
            AMEAÇA
===================================-->

<div class="enemy-card">

<div class="enemy-photo">

<img

src="assets/enemies/default.png"

alt="Ameaça">

</div>

<div class="enemy-info">

<h2>

Cultista

</h2>

<p>

Conhecimento

</p>

<p>

Nível 2

</p>

</div>

<div class="enemy-buttons">

<button
class="edit-button">

Editar

</button>

<button
class="campaign-button">

Campanha

</button>

</div>

</div>

</section>

<!--==================================
        MODAL NOVA AMEAÇA
===================================-->

<div
id="newEnemyModal"
class="modal hidden">

<div class="modal-content">

<h2>

Nova Ameaça

</h2>

<div class="field">

<label>

Nome

</label>

<input
type="text"
id="enemyName">

</div>

<div class="field">

<label>

Elemento

</label>

<select
id="enemyElement">

<option>

Sangue

</option>

<option>

Morte

</option>

<option>

Energia

</option>

<option>

Conhecimento

</option>

<option>

Medo

</option>

</select>

</div>

<div class="field">

<label>

Nível

</label>

<input
type="number"
id="enemyLevel"
value="1">

</div>

<div class="field">

<label>

Imagem

</label>

<input
type="file"
id="enemyImage"
accept="image/*">

</div>

<div class="modal-buttons">

<button
id="createEnemy"
class="primary-button">

Criar Ameaça

</button>

<button
id="cancelEnemy"
class="secondary-button">

Cancelar

</button>

</div>

</div>

</div>

<script src="js/ameacas.js"></script>

</body>

</html>
