<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Configurações • ORDEM

</title>

<link
rel="stylesheet"
href="/global.css">

<link
rel="stylesheet"
href="/configuracoes.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="background">

<div class="background-overlay"></div>

<div class="particles"></div>

</div>

<main class="settings-page">

<header class="page-header">

<a
href="index.html"
class="back-button">

← Voltar

</a>

<h1>

CONFIGURAÇÕES

</h1>

<p>

Personalize sua experiência dentro do sistema.

</p>

</header>

<div class="settings-layout">

<!--==================================
            MENU LATERAL
===================================-->

<aside class="settings-sidebar">

<button class="settings-tab active">

Conta

</button>

<button class="settings-tab">

Perfil

</button>

<button class="settings-tab">

Interface

</button>

<button class="settings-tab">

Áudio

</button>

<button class="settings-tab">

Notificações

</button>

<button class="settings-tab">

Campanhas

</button>

<button class="settings-tab">

Segurança

</button>

<button class="settings-tab">

Sobre

</button>

</aside>

<!--==================================
            CONTEÚDO
===================================-->

<section
id="settingsContent"
class="settings-content">

<h2>

Conta

</h2>

<div class="field">

<label>

Nome de Usuário

</label>

<input
type="text"
id="userName">

</div>

<div class="field">

<label>

Email

</label>

<input
type="email"
id="userEmail">

</div>

<div class="field">

<label>

Foto de Perfil

</label>

<input
type="file"
id="profileImage"
accept="image/*">

</div>

<div class="field">

<label>

Tema

</label>

<select
id="theme">

<option>

Escuro

</option>

<option>

Claro

</option>

</select>

</div>

<div class="field">

<label>

Idioma

</label>

<select
id="language">

<option>

Português (Brasil)

</option>

<option>

English

</option>

</select>

</div>

<div class="field">

<label>

Volume Geral

</label>

<input

type="range"

id="masterVolume"

min="0"

max="100"

value="100">

</div>

<div class="field">

<label>

Volume da Música

</label>

<input

type="range"

id="musicVolume"

min="0"

max="100"

value="70">

</div>

<div class="field">

<label>

Volume dos Efeitos

</label>

<input

type="range"

id="effectVolume"

min="0"

max="100"

value="100">

</div>

<div class="settings-buttons">

<button
id="saveSettings"
class="primary-button">

Salvar Alterações

</button>

<button
id="resetSettings"
class="secondary-button">

Restaurar Padrão

</button>

</div>

</section>

</div>

</main>

<script src="js/configuracoes.js"></script>

</body>

</html>
